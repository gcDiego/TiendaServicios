<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda de Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:    #121669;
            --violet:  #555fb2;
            --lavender:#d5c6ed;
            --white:   #ffffff;
            --off-white: #f7f6fc;
            --text-dark: #0d0f3f;
            --text-mid: #3d3f6e;
            --danger:  #d93030;
            --shadow: 0 8px 40px rgba(18,22,105,0.13);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--off-white);
            padding-top: 80px;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 4rem;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            box-shadow: 0 2px 15px rgba(18,22,105,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 65px;
            z-index: 100;
        }
        .navbar-brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.5rem; color: var(--navy); text-decoration: none; }
        .nav-links a {
            color: var(--text-mid);
            text-decoration: none;
            font-weight: 500;
            margin-left: 1.5rem;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .nav-links a:hover { color: var(--navy); }
        .nav-links a.active { color: var(--navy); border-bottom-color: var(--violet); }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: -1;
        }
        body::before { width: 480px; height: 480px; background: var(--violet); top: -120px; left: -120px; }
        body::after { width: 400px; height: 400px; background: var(--navy); bottom: -100px; right: -100px; }

        .wrapper {
            width: 100%;
            max-width: 820px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease both;
            margin-top: 2rem;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .cart-header {
            background: var(--navy);
            border-radius: 20px 20px 0 0;
            padding: 2.4rem 2.8rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            position: relative;
            overflow: hidden;
        }
        .cart-header::after {
            content: '';
            position: absolute;
            width: 320px; height: 320px;
            border-radius: 50%;
            background: var(--violet);
            opacity: 0.18;
            right: -80px; top: -120px;
        }
        .header-icon {
            width: 52px; height: 52px;
            background: var(--lavender);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .header-icon svg { width: 28px; height: 28px; color: var(--navy); }
        .header-text h1 { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: var(--white); letter-spacing: 0.4px; line-height: 1.2; margin: 0; }
        .header-text p { font-size: 0.82rem; color: var(--lavender); margin-top: 3px; margin-bottom: 0; font-weight: 300; letter-spacing: 0.5px; }

        .cart-card { background: var(--white); box-shadow: var(--shadow); overflow: hidden; border-radius: 0 0 20px 20px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--lavender); }
        thead th { padding: 1rem 1.4rem; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--navy); text-align: left; }
        tbody tr { border-bottom: 1px solid #ede9f8; transition: background 0.18s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f3f0fb; }
        tbody td { padding: 1.15rem 1.4rem; vertical-align: middle; color: var(--text-dark); font-size: 0.95rem; }

        .book-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600; color: var(--navy); line-height: 1.3; }
        .book-meta { font-size: 0.8rem; color: var(--text-mid); margin-top: 4px; line-height: 1.7; }
        .book-meta span { font-weight: 500; }

        .price-chip { display: inline-block; background: var(--lavender); color: var(--navy); font-weight: 500; font-size: 0.95rem; padding: 0.35rem 0.9rem; border-radius: 999px; }

        .delete-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }
        .delete-btn svg {
            width: 20px;
            height: 20px;
            color: var(--text-mid);
            transition: color 0.2s;
        }
        .delete-btn:hover svg { color: var(--danger); }

        .cart-footer {
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.3rem 2rem;
            border-radius: 0 0 20px 20px;
        }
        .cart-footer .label { font-size: 0.85rem; color: var(--lavender); letter-spacing: 0.5px; text-transform: uppercase; }
        .cart-footer .amount { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--white); font-weight: 700; }
        .checkout-btn {
            background: var(--lavender);
            color: var(--navy);
            border: none;
            border-radius: 12px;
            padding: 0.65rem 1.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.15s;
        }
        .checkout-btn:hover { background: #c4b0e6; transform: translateY(-1px); }

        .state-msg { padding: 4rem 2rem; text-align: center; color: var(--text-mid); font-size: 0.95rem; }
        .state-msg svg { display: block; margin: 0 auto 1rem; opacity: 0.3; width: 48px; height: 48px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="#" class="navbar-brand">TiendaDeServicios</a>
    <div class="nav-links">
        <a href="customer.html">Tienda</a>
        <a href="index.html" class="active">Mi Carrito</a>
        <a href="admin.html">Admin</a>
    </div>
</nav>

<div class="wrapper">
    <div class="cart-header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
        </div>
        <div class="header-text">
            <h1 id="cart-title">Carrito de Compras</h1>
            <p>Revisa tus artículos antes de continuar</p>
        </div>
    </div>

    <div class="cart-card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Detalles</th>
                        <th>Precio Unitario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cart-table-body">
                    <!-- Los artículos del carrito se inyectarán aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="cart-footer" id="cart-footer" style="display:none;">
        <div>
            <div class="label">Monto Total</div>
            <div class="amount" id="total-amount">$0.00</div>
        </div>
        <button class="checkout-btn" id="checkout-btn">Finalizar Compra &rarr;</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const selectedCartId = localStorage.getItem('selectedCartId') || '1';
        document.getElementById('cart-title').textContent = `Carrito de Compras (ID: ${selectedCartId})`;
        const tableBody = document.getElementById('cart-table-body');

        function loadCart() {
            fetch(`http://localhost:5250/api/CarritoCompras/${selectedCartId}`)
                .then(response => {
                    if (!response.ok) throw new Error(`Error HTTP! estado: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    const footer = document.getElementById('cart-footer');
                    const totalEl = document.getElementById('total-amount');
                    const cartCard = document.querySelector('.cart-card');

                    if (data && data.listaProductos && data.listaProductos.length > 0) {
                        tableBody.innerHTML = data.listaProductos.map(p => `
                            <tr data-product-id="${p.libroId}">
                                <td><div class="book-title">${p.tituloLibro}</div></td>
                                <td>
                                    <div class="book-meta">
                                        <span>Autor:</span> ${p.autorLibro || 'N/A'}<br>
                                        <span>Publicado:</span> ${p.fechaPublicacion ? new Date(p.fechaPublicacion).toLocaleDateString('es-ES') : 'N/A'}
                                    </div>
                                </td>
                                <td><span class="price-chip">$${p.precioUnitario.toFixed(2)}</span></td>
                                <td>
                                    <button class="delete-btn" title="Eliminar item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            <line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        `).join('');

                        totalEl.textContent = `$${data.total.toFixed(2)}`;
                        footer.style.display = 'flex';
                        cartCard.style.borderRadius = '0';
                    } else {
                        tableBody.innerHTML = `
                            <tr><td colspan="4">
                                <div class="state-msg">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.78l1.2-8.61H6"/>
                                    </svg>
                                    Este carrito está vacío o no existe.
                                </div>
                            </td></tr>`;
                        footer.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error al obtener los datos del carrito:', error);
                    tableBody.innerHTML = `
                        <tr><td colspan="4">
                            <div class="state-msg">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                                No se pudieron cargar los datos del carrito. Asegúrate de que todos los servicios estén activos.
                            </div>
                        </td></tr>`;
                });
        }

        // Event listener para los botones de eliminar
        tableBody.addEventListener('click', function(e) {
            const deleteButton = e.target.closest('.delete-btn');
            if (deleteButton) {
                const row = deleteButton.closest('tr');
                const productId = row.getAttribute('data-product-id');
                
                if (confirm(`¿Estás seguro de que quieres eliminar este producto del carrito?`)) {
                    fetch(`http://localhost:5250/api/CarritoCompras/${selectedCartId}/productos/${productId}`, {
                        method: 'DELETE'
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('No se pudo eliminar el producto.');
                        // Vuelve a cargar el carrito para mostrar los cambios
                        loadCart();
                    })
                    .catch(err => {
                        console.error('Error al eliminar:', err);
                        alert('Error al eliminar el producto.');
                    });
                }
            }
        });

        // Event listener para el botón de finalizar compra
        document.getElementById('checkout-btn').addEventListener('click', function() {
            alert('¡Gracias por tu compra! Tu pedido ha sido procesado exitosamente.');
        });

        // Carga inicial del carrito
        loadCart();
    });
</script>
</body>
</html>
