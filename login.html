<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:    #121669;
            --violet:  #555fb2;
            --lavender:#d5c6ed;
            --white:   #ffffff;
            --off-white: #f7f6fc;
            --text-dark: #0d0f3f;
            --text-mid: #3d3f6e;
            --danger:  #d93030;
            --shadow: 0 8px 40px rgba(18,22,105,0.13);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--off-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Blobs decorativos de fondo */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }
        body::before { width: 480px; height: 480px; background: var(--violet); top: -120px; left: -120px; }
        body::after { width: 400px; height: 400px; background: var(--navy); bottom: -100px; right: -100px; }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1;
            padding: 3rem 2.5rem;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 2.5rem; }
        .login-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--navy); margin-bottom: 0.5rem; }
        .login-header p { color: var(--text-mid); font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--navy);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--lavender);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(85, 95, 178, 0.1);
        }

        /* Estilos de Validación */
        .form-group input.invalid {
            border-color: var(--danger);
        }
        .error-message {
            display: none;
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 0.4rem;
        }
        #general-error {
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
            color: var(--danger);
            font-weight: 500;
            background-color: var(--off-white);
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid var(--danger);
        }

        .login-btn {
            width: 100%;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 10px;
            padding: 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1rem;
        }
        .login-btn:hover { background: var(--violet); transform: translateY(-1px); }
        .login-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .links { text-align: center; margin-top: 1.5rem; }
        .links a { color: var(--violet); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>Bienvenido de Vuelta</h1>
        <p>Ingresa tus credenciales para iniciar sesión.</p>
    </div>
    <form id="login-form" novalidate>
        <div id="general-error"></div>
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" required placeholder="Ingresa tu usuario">
            <div class="error-message" id="username-error">El campo de usuario no puede estar vacío.</div>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
            <div class="error-message" id="password-error">El campo de contraseña no puede estar vacío.</div>
        </div>
        <button type="submit" class="login-btn" id="login-btn" disabled>Iniciar Sesión</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('username-error');
        const passwordError = document.getElementById('password-error');
        const generalError = document.getElementById('general-error');
        const loginButton = document.getElementById('login-btn');

        // Función para validar un campo individual y mostrar/ocultar su error
        function validateField(input, errorElement, validationFn) {
            generalError.style.display = 'none'; // Ocultar el error general cuando se empieza a escribir
            if (validationFn(input.value)) {
                input.classList.remove('invalid');
                errorElement.style.display = 'none';
                return true;
            } else {
                input.classList.add('invalid');
                errorElement.style.display = 'block';
                return false;
            }
        }

        // Función para validar el formulario completo y habilitar/deshabilitar el botón
        function validateForm() {
            // Se valida sin mostrar los mensajes de error, solo para chequear el estado del botón
            const isUsernameValid = usernameInput.value.trim().length > 0;
            const isPasswordValid = passwordInput.value.trim().length > 0;
            loginButton.disabled = !(isUsernameValid && isPasswordValid);
        }

        // Añade listeners para validar en tiempo real mientras el usuario escribe
        usernameInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);

        // Evento de envío del formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Previene el envío del formulario por defecto
            
            // Realiza una última validación visual y muestra los mensajes de error de campo si están vacíos
            const isUsernameValidOnSubmit = validateField(usernameInput, usernameError, value => value.trim().length > 0);
            const isPasswordValidOnSubmit = validateField(passwordInput, passwordError, value => value.trim().length > 0);

            if (isUsernameValidOnSubmit && isPasswordValidOnSubmit) {
                // Si los campos no están vacíos, procede a verificar las credenciales específicas
                const userValue = usernameInput.value.trim();
                const passwordValue = passwordInput.value.trim();

                if (userValue === 'admin' && passwordValue === '1234') {
                    // Credenciales correctas
                    window.location.href = 'admin.html';
                } else {
                    // Credenciales incorrectas
                    generalError.textContent = 'Usuario o contraseña incorrectos.';
                    generalError.style.display = 'block';
                    usernameInput.classList.add('invalid');
                    passwordInput.classList.add('invalid');
                }
            } else {
                console.log('Formulario inválido. Por favor, completa todos los campos.');
            }
        });
    });
</script>
</body>
</html>
